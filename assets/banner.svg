<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glow-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.12)" />
      <stop offset="100%" stop-color="rgba(129, 140, 248, 0.04)" />
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="blur-bg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 38px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 16px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
        letter-spacing: 0.5px;
      }
      .card-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 13px;
        fill: #e2e8f0;
      }
      .card-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 11px;
        fill: #64748b;
      }

      /* Animated Pulsing Orbs in Background */
      @keyframes pulseGlow {
        0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
        50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.55; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatOpposite {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes dashFlow {
        0% { stroke-dashoffset: 60; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pillGlow {
        0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 2px rgba(56,189,248,0.4)); }
        50% { opacity: 1; filter: drop-shadow(0 0 8px rgba(129,140,248,0.8)); }
      }

      .pulse-orb-1 {
        animation: pulseGlow 8s ease-in-out infinite;
        transform-origin: 200px 100px;
      }
      .pulse-orb-2 {
        animation: pulseGlow 10s ease-in-out infinite reverse;
        transform-origin: 950px 220px;
      }
      .float-card-1 {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .float-card-2 {
        animation: floatOpposite 6s ease-in-out infinite;
      }
      .flowing-line {
        stroke-dasharray: 6 6;
        animation: dashFlow 2.5s linear infinite;
      }
      .pill-pulse {
        animation: pillGlow 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Background Decorative Glowing Orbs -->
  <g filter="url(#blur-bg)">
    <circle class="pulse-orb-1" cx="220" cy="90" r="130" fill="#38bdf8" />
    <circle class="pulse-orb-2" cx="960" cy="240" r="150" fill="#818cf8" />
    <circle cx="600" cy="320" r="90" fill="#c084fc" opacity="0.25" />
  </g>

  <!-- Geometric Grid Pattern Overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Dynamic Animated Metric/Flow Lines (Behind Text) -->
  <g opacity="0.45">
    <path class="flowing-line" d="M 80 290 Q 240 260 400 295 T 720 280 T 1120 270" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="flowing-line" d="M 80 305 Q 260 325 440 300 T 800 315 T 1120 295" fill="none" stroke="#818cf8" stroke-width="1.5" />
  </g>

  <!-- Floating Dynamic Tech Cards (Placed to sides/corners so they do not overlap center text) -->
  <!-- Left Side Metric Card -->
  <g class="float-card-1" transform="translate(60, 50)">
    <rect width="180" height="74" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.2" />
    <circle cx="28" cy="37" r="16" fill="rgba(56, 189, 248, 0.15)" />
    <path d="M 22 37 L 27 42 L 35 32" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="54" y="32" class="card-title">Recurring Engine</text>
    <text x="54" y="49" class="card-sub">Active &amp; Automated</text>
    <circle cx="160" cy="20" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Right Side Metric Card -->
  <g class="float-card-2" transform="translate(960, 50)">
    <rect width="180" height="74" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1.2" />
    <circle cx="28" cy="37" r="16" fill="rgba(129, 140, 248, 0.15)" />
    <path d="M 22 37 C 22 31 34 31 34 37 C 34 43 22 43 22 37" fill="none" stroke="#818cf8" stroke-width="2" />
    <text x="54" y="32" class="card-title">Billing Lifecycle</text>
    <text x="54" y="49" class="card-sub">Global Dunning &amp; Tax</text>
    <circle cx="160" cy="20" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- ================= FOREGROUND CONTENT ================= -->
  <!-- Top Category Chip / Pill -->
  <g class="pill-pulse" transform="translate(460, 42)">
    <rect width="280" height="30" rx="15" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
    <circle cx="16" cy="15" r="4" fill="#38bdf8" />
    <text x="28" y="20" class="badge-text" fill="#38bdf8">CURATED MONETIZATION INFRASTRUCTURE</text>
  </g>

  <!-- Main Headline Title (Clear Foreground, crisp hierarchy) -->
  <g transform="translate(600, 130)">
    <!-- Primary Heading with Gradient -->
    <text text-anchor="middle" class="title-text">
      Subscription Account Administration
    </text>
    <text text-anchor="middle" y="40" class="title-text" fill="url(#accent-grad)" style="fill: url(#accent-grad);">
      &amp; Recurring Billing
    </text>

    <!-- Subtitle -->
    <text text-anchor="middle" y="86" class="subtitle-text">
      Top Commercial SaaS Platforms &amp; Open-Source Billing Engines for Modern Software
    </text>
  </g>

  <!-- Bottom Dynamic Interactive Feature Badges -->
  <g transform="translate(600, 290)">
    <!-- Feature Pill 1: SaaS Consoles -->
    <g transform="translate(-320, 0)">
      <rect width="145" height="32" rx="16" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
      <text x="72" y="20" text-anchor="middle" class="badge-text" fill="#93c5fd">⚡ SaaS Consoles</text>
    </g>

    <!-- Feature Pill 2: Open Source -->
    <g transform="translate(-155, 0)">
      <rect width="140" height="32" rx="16" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(129, 140, 248, 0.35)" stroke-width="1" />
      <text x="70" y="20" text-anchor="middle" class="badge-text" fill="#c7d2fe">🔓 Open Source</text>
    </g>

    <!-- Feature Pill 3: Usage Metering -->
    <g transform="translate(5, 0)">
      <rect width="145" height="32" rx="16" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(192, 132, 252, 0.35)" stroke-width="1" />
      <text x="72" y="20" text-anchor="middle" class="badge-text" fill="#e9d5ff">📊 Usage Metering</text>
    </g>

    <!-- Feature Pill 4: Dunning & Revenue -->
    <g transform="translate(170, 0)">
      <rect width="150" height="32" rx="16" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(34, 197, 94, 0.35)" stroke-width="1" />
      <text x="75" y="20" text-anchor="middle" class="badge-text" fill="#86efac">🛡️ Dunning &amp; Tax</text>
    </g>
  </g>

  <!-- Border Highlight Accent -->
  <rect width="1200" height="360" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />
</svg>
